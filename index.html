<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="20 關 2D 迷霧迷宮遊戲，探索暗處、解鎖關卡、挑戰最佳時間與步數。" />
  <meta name="theme-color" content="#0a0a1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>迷霧迷宮 Maze Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@400;700&family=Press+Start+2P&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
  <script>
    // 📡 統計打點三層(skill play-stats-lite / play-stats-dwell;0907 全艦隊健檢「零統計打點」補齊):
    //    ① 開啟 ② -done 完賽(engine.ts onWin 呼叫 window.psDone)③ -dwell 真實停留(開頁到第一次離開,3~1800 秒才算)。
    //    零個資:只送「站 id + 事件(+秒數)」。離線 / 被擋 / 本機預覽一律靜默 —— 統計是配菜,壞掉絕不影響遊戲。
    //    ★ 黑名單不白名單:只擋本機開發,搬站(pages.dev ↔ workers.dev)不會斷流。
    //    ★ 0907:自家 Playwright 體檢(navigator.webdriver)或帶 ?audit=1 的開頁不算玩家。
    (function () {
      var ID = '23dmaze'
      var API = 'https://hfpc-play-stats.summer09201017.workers.dev/api/ping?g='
      var LOCAL = ['localhost', '127.0.0.1', '::1', ''].indexOf(location.hostname) >= 0 || location.protocol === 'file:'
      var BOT = !!navigator.webdriver || /[?&]audit=1(&|$)/.test(location.search)
      window.psPing = function (evt, sec) {   // evt 例:ID(開啟)/ ID-done(完賽)/ ID-dwell(停留,帶秒)
        if (LOCAL || BOT) return
        try {
          var u = API + evt + (sec ? '&t=' + Math.round(sec) : '')
          if (navigator.sendBeacon) navigator.sendBeacon(u)
          else fetch(u, { mode: 'no-cors', keepalive: true }).catch(function () {})
        } catch (e) { /* 統計是配菜:不重試、不報錯 */ }
      }
      window.psDone = function () { window.psPing(ID + '-done') }   // ② 完賽:過一關那一刻呼叫
      window.psPing(ID)                                             // ① 開啟
      var t0 = Date.now(), sent = false
      function dwell () {                                           // ③ 真實停留:只發一次
        if (sent) return
        sent = true
        var sec = (Date.now() - t0) / 1000
        if (sec >= 3 && sec <= 1800) window.psPing(ID + '-dwell', sec)
      }
      addEventListener('pagehide', dwell)
      addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') dwell() })
    })()
  </script>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
